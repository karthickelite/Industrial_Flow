<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Monitoring System IoT</title>

  <style>
    :root {
      --panel: #0b1320;
      --card: rgba(19, 31, 50, 0.85);
      --border: #1e2d4a;

      --sky: #38bdf8;
      --green: #10b981;
      --red: #f43f5e;
      --gold: #f59e0b;

      --white: #ffffff;
      --muted: #8492a6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: #060a12;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    /* =========================
       WELCOME SCREEN
       ========================= */
    .welcome-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      animation: welcomeHide 1s ease 3.5s forwards;
    }

    .welcome {
      text-align: center;
      animation: welcomeShow 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .welcome h1 {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #38bdf8;
      text-shadow: 0 0 40px rgba(56, 189, 248, 0.3);
    }

    .welcome p {
      margin-top: 20px;
      font-size: 20px;
      color: var(--muted);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    @keyframes welcomeShow {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes welcomeHide {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* =========================
       MAIN DASHBOARD
       ========================= */
    .dashboard {
      width: 100vw;
      height: 100vh;
      background: 
        linear-gradient(rgba(11, 19, 32, 0.85), rgba(6, 10, 18, 0.92)),
        url("https://images.unsplash.com/photo-1581092160562-40aa08e78837?auto=format&fit=crop&w=1920&q=80");
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      height: 15%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: rgba(8, 15, 26, 0.85);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }

    .header h1 {
      font-size: 32px;
      letter-spacing: 3px;
      color: var(--white);
    }

    .header p {
      margin-top: 8px;
      color: var(--sky);
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: 600;
    }

    /* CONTENT */
    .content {
      height: 73%;
      padding: 30px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 25px;
    }

    /* SENSOR CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    .card {
      height: 210px;
      padding: 25px 30px;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    .card:before {
      content: "";
      position: absolute;
      height: 4px;
      top: 0;
      left: 0;
      width: 100%;
      border-radius: 16px 16px 0 0;
    }

    .temp:before { background: var(--red); }
    .pressure:before { background: var(--sky); }
    .flow:before { background: var(--green); }
    .valve:before { background: var(--gold); }

    .title {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
    }

    .icon {
      font-size: 24px;
      margin-right: 12px;
    }

    .value {
      margin-top: 15px;
      font-size: 52px;
      font-weight: 800;
    }

    .unit {
      font-size: 20px;
      color: var(--muted);
      font-weight: 500;
      margin-left: 5px;
    }

    /* FLOW PIE */
    .water-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    .water-panel h2 {
      color: var(--muted);
      font-size: 16px;
      letter-spacing: 2px;
    }

    .pie {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: conic-gradient(var(--sky) 0 72%, #18263e 72% 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 25px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
    }

    .pie span {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      background: #0d1726;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      color: var(--white);
    }

    .water-label {
      color: var(--sky);
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 600;
    }

    /* SOLENOID SWITCH */
    .valve-control {
      display: flex;
      align-items: center;
      gap: 25px;
      margin-top: 15px;
    }

    .switch {
      width: 80px;
      height: 40px;
      position: relative;
    }

    .switch input {
      display: none;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #22334e;
      border-radius: 50px;
      cursor: pointer;
      transition: .3s;
    }

    .slider:before {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      left: 5px;
      bottom: 5px;
      background: white;
      border-radius: 50%;
      transition: .3s;
    }

    input:checked + .slider {
      background: var(--green);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }

    input:checked + .slider:before {
      transform: translateX(40px);
    }

    /* FOOTER */
    .footer {
      height: 12%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      background: rgba(6, 11, 18, 0.95);
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
      backdrop-filter: blur(8px);
    }

    .time {
      color: var(--sky);
      font-family: monospace;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <!-- =========================
       WELCOME SCREEN
       ========================= -->
  <div class="welcome-screen">
    <div class="welcome">
      <h1>WELCOME</h1>
      <p>Smart Monitoring System IoT</p>
    </div>
  </div>

  <!-- =========================
       MAIN DASHBOARD
       ========================= -->
  <div class="dashboard">

    <!-- HEADER -->
    <div class="header">
      <div>
        <h1>SMART MONITORING SYSTEM IoT</h1>
        <p>INDUSTRIAL WATER MONITORING CONTROL PANEL</p>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content">

      <!-- SENSOR SECTION -->
      <div class="cards">

        <!-- TEMPERATURE -->
        <div class="card temp">
          <div class="title">
            <span class="icon">🌡</span>
            TEMPERATURE
          </div>
          <div class="value" id="val-temp" style="color:var(--red)">
            28.0<span class="unit">°C</span>
          </div>
        </div>

        <!-- PRESSURE -->
        <div class="card pressure">
          <div class="title">
            <span class="icon">◉</span>
            PRESSURE
          </div>
          <div class="value" id="val-pressure" style="color:var(--sky)">
            4.8<span class="unit">PSI</span>
          </div>
        </div>

        <!-- WATER FLOW -->
        <div class="card flow">
          <div class="title">
            <span class="icon">💧</span>
            WATER FLOW
          </div>
          <div class="value" id="val-flow" style="color:var(--green)">
            12.3<span class="unit">LPH</span>
          </div>
        </div>

        <!-- SOLENOID CONTROL -->
        <div class="card valve">
          <div class="title">
            <span class="icon">⚡</span>
            SOLENOID VALVE
          </div>
          <div class="valve-control">
            <div id="state" class="value" style="color:var(--gold); margin-top:0;">
              OFF
            </div>
            <label class="switch">
              <input type="checkbox" id="switch">
              <span class="slider"></span>
            </label>
          </div>
        </div>

      </div>

      <!-- WATER FLOW PIE -->
      <div class="water-panel">
        <h2>WATER FLOW STATUS</h2>
        <div class="pie" id="pie-chart">
          <span id="pie-val">72%</span>
        </div>
        <div class="water-label">FLOW UTILIZATION</div>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
      <div>LAST UPDATE</div>
      <div class="time" id="val-time">2026-07-31 12:00:00</div>
    </div>

  </div>

  <!-- =========================
       FIREBASE INTEGRATION
       ========================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

    // Replace with your Realtime Database URL
   const firebaseConfig = {
  apiKey: "AIzaSyAYICQJf9SkNrEA6DWo76iNTdj39IBonNc",
  authDomain: "industrial-flow-monitoring.firebaseapp.com",
  databaseURL: "https://industrial-flow-monitoring-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "industrial-flow-monitoring",
  storageBucket: "industrial-flow-monitoring.firebasestorage.app",
  messagingSenderId: "174076656178",
  appId: "1:174076656178:web:a2f16d8ba4450ed54e5a2b"
};

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const switchButton = document.getElementById("switch");
    const stateText = document.getElementById("state");
    const tempVal = document.getElementById("val-temp");
    const pressureVal = document.getElementById("val-pressure");
    const flowVal = document.getElementById("val-flow");
    const timeVal = document.getElementById("val-time");

    // 1. Send Solenoid Toggle Command to Firebase on Click
    switchButton.addEventListener("change", function () {
      const command = this.checked ? "ON" : "OFF";
      set(ref(database, 'waterSystem/Solenoid'), command);
    });

    // 2. Real-time Listener from Firebase (Updates Webpage when ESP32 or Firebase changes)
    const waterSystemRef = ref(database, 'waterSystem');
    onValue(waterSystemRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        if (data.Temperature !== undefined) tempVal.innerHTML = `${data.Temperature}<span class="unit">°C</span>`;
        if (data.Pressure !== undefined) pressureVal.innerHTML = `${data.Pressure}<span class="unit">PSI</span>`;
        if (data.Flow !== undefined) flowVal.innerHTML = `${data.Flow}<span class="unit">LPH</span>`;
        if (data.Timestamp !== undefined) timeVal.textContent = data.Timestamp;

        if (data.Solenoid === "ON") {
          switchButton.checked = true;
          stateText.innerHTML = "ON";
          stateText.style.color = "var(--green)";
        } else {
          switchButton.checked = false;
          stateText.innerHTML = "OFF";
          stateText.style.color = "var(--gold)";
        }
      }
    });
  </script>

</body>
</html>
